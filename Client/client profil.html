<script>
/* ---------- panier (mémorisé dans le navigateur) ---------- */
const CLE = "appdeliverPanier";

function lirePanier() {
  try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; }
}

function sauverPanier(p) {
  try { localStorage.setItem(CLE, JSON.stringify(p)); } catch (e) {}
  majBadge();
}

function majBadge() {
  const n = lirePanier().reduce((a, x) => a + x.qte, 0);
  const b = document.getElementById("nbPanier");
  if (b) { b.textContent = n; b.hidden = (n === 0); }
}

function ajouterAuPanier(nom, prix, icone) {
  const p = lirePanier();
  const existant = p.find(x => x.nom === nom);
  if (existant) existant.qte++; else p.push({ nom: nom, prix: prix, icone: icone, qte: 1 });
  sauverPanier(p);
}

function fcfa(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

/* boutons « Ajouter » des cartes produits */
document.querySelectorAll(".ajouter").forEach(b => {
  b.addEventListener("click", () => {
    ajouterAuPanier(b.dataset.nom, Number(b.dataset.prix), b.dataset.ic);
    const avant = b.innerHTML;
    b.innerHTML = '<i class="fa-solid fa-check"></i> Ajouté';
    setTimeout(() => b.innerHTML = avant, 900);
  });
});

majBadge();

/* ---------- changer la photo ---------- */
document.getElementById("fichierP").addEventListener("change", function () {
  const f = this.files[0];
  if (!f) return;
  const lecteur = new FileReader();
  lecteur.onload = e => document.getElementById("photoP").src = e.target.result;
  lecteur.readAsDataURL(f);
});

/* ---------- thème : système / clair / sombre ---------- */
function appliquerTheme(choix) {
  let sombre = (choix === "sombre");
  if (choix === "systeme") sombre = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.body.classList.toggle("sombre", sombre);
  try { localStorage.setItem("appdeliverTheme", choix); } catch (e) {}
}

document.querySelectorAll("input[name='theme']").forEach(r => {
  r.addEventListener("change", () => appliquerTheme(r.value));
});

try {
  const memo = localStorage.getItem("appdeliverTheme");
  if (memo) {
    document.querySelector("input[name='theme'][value='" + memo + "']").checked = true;
    appliquerTheme(memo);
  }
} catch (e) {}

</script>
